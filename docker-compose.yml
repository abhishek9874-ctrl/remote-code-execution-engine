services:
  postgres:
    image: postgres:16-alpine
    container_name: cee-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: code_exec_engine
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cee-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    # appendonly persists the queue across restarts. Without it, a Redis
    # restart silently drops every queued-but-unprocessed job.
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
  
  prometheus:
    image: prom/prometheus:latest
    container_name: code-exec-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  
  grafana:
    image: grafana/grafana:latest
    container_name: code-exec-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      - prometheus
  

volumes:
  pgdata:
  redisdata:
  prometheus_data:
  grafana_data:
